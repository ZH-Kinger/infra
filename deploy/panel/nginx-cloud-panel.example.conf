# 线上 /etc/nginx/sites-enabled/cloud-panel 的留底。公司网段已换成占位，真值只在服务器上。
# 云账号平台。TLS 在这层终止，转给本机的面板进程；面板只绑 127.0.0.1，外面唯一入口是这里。
#
# 访问范围按**路径**分，不在安全组上一刀切：
#   · 面板本身只给公司网段 —— 这是「服务只能公司内网访问」那条要求
#   · **取件页必须对公网开放** —— /c/<单号>#<密钥> 是发给外部使用方的，
#     他们没有面板账号，也不在公司网段里。把它一起关掉，凭证发放整条链就断了。
#     那条路径本身没有登录门，靠的是密钥在 URL 片段里（不发给服务端）+ 两层限流。
geo $office {
    default 0;
    <公司出口网段>   1;
    <公司出口网段>     1;
    <公司出口网段>   1;
    <公司出口网段>   1;
    <公司出口网段>    1;
    <公司出口网段>    1;
    <公司出口网段>  1;   # 运维出口，换了要同步改
    <公司出口网段>        1;   # 本机自检（部署脚本会 curl 自己）
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    # 证书续期验证留一条路（将来换正式证书用）
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # 按 IP 访问（兜底）。**保留自签证书**：已经发出去的取件链接写的是 IP，
    # 那些链接要能继续打开。新发的一律用下面的域名
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_certificate     /etc/cloud-panel/panel.crt;
    ssl_certificate_key /etc/cloud-panel/panel.key;
    include /etc/nginx/snippets/cloud-panel-common.conf;
}

server {
    # 正式域名。证书由 certbot 续期（certbot.timer），续期后 deploy hook 会 reload nginx
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cloud.wuji-tech.com;
    ssl_certificate     /etc/letsencrypt/live/cloud.wuji-tech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloud.wuji-tech.com/privkey.pem;
    include /etc/nginx/snippets/cloud-panel-common.conf;
}
