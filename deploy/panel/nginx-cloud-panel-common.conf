# 两个 443 server（域名 / 按 IP）共用的部分。改这里，别在两处各改一份。
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # 属性表 CSV 可能较大，另外审批回调不要被缓冲卡住
    client_max_body_size 2m;
    proxy_read_timeout 120s;

    # 转发头写一次，两类 location 共用
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # ── 对外开放：取件页 ────────────────────────────────────────────────
    # 外部使用方拿到的链接就长这样。app.css 也要给，否则页面没有样式
    location ^~ /c/            { proxy_pass http://127.0.0.1:8765; }
    location = /pickup.js      { proxy_pass http://127.0.0.1:8765; }
    location = /api/pickup     { proxy_pass http://127.0.0.1:8765; }
    # 飞书审批回调：飞书的服务器不在公司网里，必须绕过 IP 白名单。
    # 门是应用的 Verification Token（面板侧没配就一律 403），不是网络位置
    location = /feishu/approval { proxy_pass http://127.0.0.1:8765; }
    location = /app.css        { proxy_pass http://127.0.0.1:8765; }

    # ── 其余：只给公司网段 ──────────────────────────────────────────────
    location / {
        if ($office = 0) { return 403 "not in company network"; }
        proxy_pass http://127.0.0.1:8765;
    }
