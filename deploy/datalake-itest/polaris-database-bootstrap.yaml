apiVersion: batch/v1
kind: Job
metadata:
  name: polaris-database-bootstrap
  namespace: datalake-itest
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        workload: cpu
      containers:
        - name: postgresql-client
          image: docker.m.daocloud.io/library/postgres:16.4-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: datalake-itest-lakefs-config
                  key: POSTGRES_PASSWORD
            - name: POLARIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: datalake-itest-polaris-persistence
                  key: password
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until pg_isready -h lakefs-postgresql -U lakefs -d postgres; do sleep 3; done
              if ! psql -h lakefs-postgresql -U lakefs -d postgres -tAc \
                "SELECT 1 FROM pg_roles WHERE rolname='polaris'" | grep -q 1; then
                psql -h lakefs-postgresql -U lakefs -d postgres -v ON_ERROR_STOP=1 \
                  -c "CREATE USER polaris WITH PASSWORD '$POLARIS_PASSWORD'"
              else
                psql -h lakefs-postgresql -U lakefs -d postgres -v ON_ERROR_STOP=1 \
                  -c "ALTER USER polaris WITH PASSWORD '$POLARIS_PASSWORD'"
              fi
              if ! psql -h lakefs-postgresql -U lakefs -d postgres -tAc \
                "SELECT 1 FROM pg_database WHERE datname='polaris'" | grep -q 1; then
                createdb -h lakefs-postgresql -U lakefs -O polaris polaris
              fi
