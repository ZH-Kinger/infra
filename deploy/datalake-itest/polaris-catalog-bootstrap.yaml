apiVersion: batch/v1
kind: Job
metadata:
  name: polaris-catalog-bootstrap
  namespace: datalake-itest
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        workload: cpu
      containers:
        - name: curl
          image: docker.m.daocloud.io/curlimages/curl:8.10.1
          imagePullPolicy: IfNotPresent
          env:
            - name: POLARIS_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: datalake-itest-polaris-client
                  key: POLARIS_CLIENT_ID
            - name: POLARIS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: datalake-itest-polaris-client
                  key: POLARIS_CLIENT_SECRET
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until curl -fsS --connect-timeout 5 --max-time 10 \
                http://polaris-mgmt:8182/q/health/ready >/dev/null; do sleep 3; done
              token_status=$(curl -sS --connect-timeout 5 --max-time 30 \
                -o /tmp/token-response -w '%{http_code}' -X POST \
                -H 'Content-Type: application/x-www-form-urlencoded' \
                --data-urlencode grant_type=client_credentials \
                --data-urlencode "client_id=$POLARIS_CLIENT_ID" \
                --data-urlencode "client_secret=$POLARIS_CLIENT_SECRET" \
                --data-urlencode scope=PRINCIPAL_ROLE:ALL \
                http://polaris:8181/api/catalog/v1/oauth/tokens)
              if [ "$token_status" != 200 ]; then
                cat /tmp/token-response >&2
                exit 1
              fi
              token=$(sed -n \
                's/.*"access_token"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' \
                /tmp/token-response)
              test -n "$token"
              status=$(curl -sS --connect-timeout 5 --max-time 30 \
                -o /tmp/catalog-response -w '%{http_code}' -X POST \
                -H "Authorization: Bearer $token" \
                -H 'Content-Type: application/json' \
                --data @- http://polaris:8181/api/management/v1/catalogs <<'JSON'
              {
                "catalog": {
                  "name": "robotics",
                  "type": "INTERNAL",
                  "readOnly": false,
                  "properties": {
                    "default-base-location": "s3://polaris-warehouse/iceberg/"
                  },
                  "storageConfigInfo": {
                    "storageType": "S3",
                    "allowedLocations": ["s3://polaris-warehouse/iceberg/"],
                    "endpoint": "http://minio.datalake-itest.svc.cluster.local:9000",
                    "endpointInternal": "http://minio.datalake-itest.svc.cluster.local:9000",
                    "stsUnavailable": true,
                    "pathStyleAccess": true,
                    "region": "us-east-1"
                  }
                }
              }
              JSON
              )
              case "$status" in
                201|204) ;;
                409)
                  get_status=$(curl -sS --connect-timeout 5 --max-time 30 \
                    -o /tmp/current-catalog -w '%{http_code}' \
                    -H "Authorization: Bearer $token" \
                    http://polaris:8181/api/management/v1/catalogs/robotics)
                  if [ "$get_status" != 200 ]; then
                    cat /tmp/current-catalog >&2
                    exit 1
                  fi
                  entity_version=$(sed -n \
                    's/.*"entityVersion"[[:space:]]*:[[:space:]]*\([0-9][0-9]*\).*/\1/p' \
                    /tmp/current-catalog)
                  test -n "$entity_version"
                  update_status=$(curl -sS --connect-timeout 5 --max-time 30 \
                    -o /tmp/update-response -w '%{http_code}' -X PUT \
                    -H "Authorization: Bearer $token" \
                    -H 'Content-Type: application/json' \
                    --data @- http://polaris:8181/api/management/v1/catalogs/robotics <<JSON
              {
                "currentEntityVersion": $entity_version,
                "properties": {
                  "default-base-location": "s3://polaris-warehouse/iceberg/"
                },
                "storageConfigInfo": {
                  "storageType": "S3",
                  "allowedLocations": ["s3://polaris-warehouse/iceberg/"],
                  "endpoint": "http://minio.datalake-itest.svc.cluster.local:9000",
                  "endpointInternal": "http://minio.datalake-itest.svc.cluster.local:9000",
                  "stsUnavailable": true,
                  "pathStyleAccess": true,
                  "region": "us-east-1"
                }
              }
              JSON
                  )
                  if [ "$update_status" != 200 ]; then
                    cat /tmp/update-response >&2
                    exit 1
                  fi
                  ;;
                *) cat /tmp/catalog-response >&2; exit 1 ;;
              esac
