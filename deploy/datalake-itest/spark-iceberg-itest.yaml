apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: iceberg-itest
  namespace: datalake-itest
spec:
  type: Python
  mode: cluster
  image: docker.m.daocloud.io/apache/spark:3.5.5
  imagePullPolicy: IfNotPresent
  mainApplicationFile: local:///opt/spark/itest/iceberg_itest.py
  sparkVersion: 3.5.5
  timeToLiveSeconds: 3600
  restartPolicy:
    type: Never
  deps:
    packages:
      - org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.10.2
      - org.apache.hadoop:hadoop-aws:3.3.4
      - org.apache.hadoop:hadoop-aliyun:3.3.4
      - org.apache.iceberg:iceberg-aws-bundle:1.10.2
    repositories:
      - https://maven.aliyun.com/repository/public
  sparkConf:
    spark.jars.ivy: /tmp/spark-ivy-cache
    spark.jars.ivySettings: file:///etc/spark-operator/ivysettings.xml
    spark.sql.extensions: org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
    spark.sql.catalog.datalake: org.apache.iceberg.spark.SparkCatalog
    spark.sql.catalog.datalake.type: rest
    spark.sql.catalog.datalake.uri: http://polaris:8181/api/catalog
    spark.sql.catalog.datalake.oauth2-server-uri: http://polaris:8181/api/catalog/v1/oauth/tokens
    spark.sql.catalog.datalake.scope: PRINCIPAL_ROLE:ALL
    spark.sql.catalog.datalake.token-refresh-enabled: "false"
    spark.sql.catalog.datalake.warehouse: robotics
    spark.sql.catalog.datalake.io-impl: org.apache.iceberg.aws.s3.S3FileIO
    spark.sql.defaultCatalog: datalake
    spark.hadoop.fs.oss.impl: org.apache.hadoop.fs.aliyun.oss.AliyunOSSFileSystem
    spark.hadoop.fs.AbstractFileSystem.oss.impl: org.apache.hadoop.fs.aliyun.oss.OSS
    spark.hadoop.fs.oss.endpoint: __OSS_ENDPOINT__
    spark.hadoop.fs.s3a.endpoint: http://minio.datalake-itest.svc.cluster.local:9000
    spark.hadoop.fs.s3a.path.style.access: "true"
    spark.hadoop.fs.s3a.connection.ssl.enabled: "false"
    spark.hadoop.fs.s3a.aws.credentials.provider: org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
    spark.serializer: org.apache.spark.serializer.KryoSerializer
    spark.sql.shuffle.partitions: "64"
    spark.dynamicAllocation.enabled: "false"
  volumes:
    - name: itest-code
      configMap:
        name: datalake-itest-spark-code
    - name: ivy-settings
      configMap:
        name: spark-workload-ivy-settings
  driver:
    cores: 1
    memory: 2g
    serviceAccount: spark-itest
    nodeSelector:
      workload: cpu
    volumeMounts:
      - name: itest-code
        mountPath: /opt/spark/itest
      - name: ivy-settings
        mountPath: /etc/spark-operator/ivysettings.xml
        subPath: ivysettings.xml
        readOnly: true
    envFrom:
      - configMapRef:
          name: datalake-itest-runtime
      - secretRef:
          name: datalake-itest-oss-sts
      - secretRef:
          name: datalake-itest-minio
      - secretRef:
          name: datalake-itest-polaris-client
    env:
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: datalake-itest-minio
            key: MINIO_ROOT_USER
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: datalake-itest-minio
            key: MINIO_ROOT_PASSWORD
      - name: AWS_REGION
        value: us-east-1
  executor:
    instances: 4
    cores: 2
    memory: 6g
    nodeSelector:
      workload: cpu
    volumeMounts:
      - name: itest-code
        mountPath: /opt/spark/itest
      - name: ivy-settings
        mountPath: /etc/spark-operator/ivysettings.xml
        subPath: ivysettings.xml
        readOnly: true
    envFrom:
      - configMapRef:
          name: datalake-itest-runtime
      - secretRef:
          name: datalake-itest-oss-sts
      - secretRef:
          name: datalake-itest-minio
      - secretRef:
          name: datalake-itest-polaris-client
    env:
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: datalake-itest-minio
            key: MINIO_ROOT_USER
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: datalake-itest-minio
            key: MINIO_ROOT_PASSWORD
      - name: AWS_REGION
        value: us-east-1
