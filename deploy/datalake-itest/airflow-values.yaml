executor: LocalExecutor

defaultAirflowRepository: docker.m.daocloud.io/apache/airflow
defaultAirflowTag: "3.2.2"

nodeSelector:
  workload: cpu

postgresql:
  enabled: true
  image:
    registry: docker.m.daocloud.io
    repository: bitnamilegacy/postgresql
    tag: "16.1.0-debian-11-r15"
  primary:
    nodeSelector:
      workload: cpu
    persistence:
      enabled: true
      size: 20Gi
      storageClass: alicloud-disk-essd

redis:
  enabled: false

statsd:
  enabled: false

scheduler:
  replicas: 2
  serviceAccount:
    create: true
    name: airflow-scheduler
  extraVolumes:
    - name: datalake-itest-dags
      configMap:
        name: datalake-itest-airflow-dags
  extraVolumeMounts:
    - name: datalake-itest-dags
      mountPath: /opt/airflow/dags/datalake_itest.py
      subPath: datalake_itest.py
      readOnly: true
    - name: datalake-itest-dags
      mountPath: /opt/airflow/dags/spark-iceberg-itest.yaml
      subPath: spark-iceberg-itest.yaml
      readOnly: true

# LocalExecutor reuses worker persistence settings for scheduler logs.
workers:
  persistence:
    storageClassName: alicloud-disk-essd
  celery:
    persistence:
      storageClassName: alicloud-disk-essd

apiServer:
  replicas: 2

triggerer:
  replicas: 1
  persistence:
    storageClassName: alicloud-disk-essd

dags:
  persistence:
    enabled: false
  gitSync:
    enabled: false

dagProcessor:
  extraVolumes:
    - name: datalake-itest-dags
      configMap:
        name: datalake-itest-airflow-dags
  extraVolumeMounts:
    - name: datalake-itest-dags
      mountPath: /opt/airflow/dags/datalake_itest.py
      subPath: datalake_itest.py
      readOnly: true
    - name: datalake-itest-dags
      mountPath: /opt/airflow/dags/spark-iceberg-itest.yaml
      subPath: spark-iceberg-itest.yaml
      readOnly: true

config:
  core:
    load_examples: "False"
  scheduler:
    standalone_dag_processor: "False"

createUserJob:
  defaultUser:
    enabled: false

# Avoid a --wait/post-install deadlock: application init containers wait for
# migrations, so the migration job must be created as a regular resource.
migrateDatabaseJob:
  useHelmHooks: false
