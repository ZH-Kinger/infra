<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>云权限面板</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <span class="brand">云权限面板</span>
      <nav class="tabs" id="tabs" hidden>
        <a class="tab" data-tab="me" href="#me">我的权限</a>
        <a class="tab" data-tab="admin" href="#admin" id="tab-admin" hidden>人员总览</a>
      </nav>
      <div class="who" id="who" hidden>
        <span class="who-name" id="who-name"></span>
        <span class="pill" id="who-role"></span>
        <a id="logout" href="/auth/logout">退出</a>
      </div>
    </div>
  </header>
  <main class="wrap" id="app" aria-live="polite">
    <div class="skeleton" aria-hidden="true">
      <div class="sk sk-title"></div>
      <div class="sk sk-card"></div>
      <div class="sk sk-card"></div>
    </div>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
