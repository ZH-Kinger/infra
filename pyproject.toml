[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lakefs-cpfs-dataset-sink"
version = "0.1.0"
description = "Materialize immutable lakeFS dataset releases onto CPFS for Alibaba Cloud PAI"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
lakefs = ["lakefs>=0.7"]
s3 = ["boto3>=1.34"]
all = ["lakefs>=0.7", "boto3>=1.34"]

[project.scripts]
dataset-sink = "dataset_sink.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

