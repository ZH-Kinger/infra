[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lakefs-cpfs-dataset-sink"
version = "0.1.0"
description = "Materialize immutable lakeFS dataset releases onto CPFS for Alibaba Cloud PAI"
requires-python = ">=3.9"
# 面板长期是零运行时依赖。下面几个都是「没有替代品」才加的，加之前都验证过没有别的路。
#
#   cryptography —— 访问凭证要能被使用方反复查看，就必须存下来；存下来就必须加密
#     （否则 tickets.json 泄漏等于凭证泄漏）；而标准库里没有 AES，AEAD 自己搓必错。
#     见 src/delivery/sealed.py。
#
#   alibabacloud-* / volcengine-* —— 数据迁移。**试过不加**：面板自己的 ACS 1.0 签名
#     对迁移服务无效，实测「正确签名」和「故意签坏的签名」回的是同一个
#     `Anonymous access is forbidden` —— 它根本没读那个 Authorization 头。
#     盲猜签名方式的代价是把 21TB 搬到错的地方，不值。
#     这几个 SDK 在 bot 那边真机跑过（TOS→OSS 已验、OSS→OSS 跨 region 179MB 已验、
#     火山 TOS→TOS task 553276 已验），搬过来用的是同一套调用。
dependencies = [
  "cryptography>=41",
  "alibabacloud-hcs-mgw20240626>=1.0.8",
  "alibabacloud-tea-openapi>=0.4",
  "volcengine-python-sdk>=1.0",
  # 火山 TOS 的桶清单。迁移能选哪些桶是定时从两朵云拉的，不手工维护 ——
  # 手工那份第二天就是错的（删了的还在选、新建的选不到），而两种都没人会报 bug
  "tos>=2.7",
]

[project.optional-dependencies]
lakefs = ["lakefs>=0.7"]
s3 = ["boto3>=1.34"]
all = ["lakefs>=0.7", "boto3>=1.34"]
dev = ["ruff>=0.9", "pre-commit>=4.0"]

[project.scripts]
dataset-sink = "dataset_sink.cli:main"
delivery = "delivery.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# 面板前端是纯静态文件，要随包安装，否则 pip install 后 / 返回「前端文件缺失」
[tool.setuptools.package-data]
delivery = ["web/*.html", "web/*.css", "web/*.js"]

[tool.ruff]
line-length = 100
# Match the floor declared in requires-python so lint never suggests newer syntax
# than the oldest interpreter this ships on.
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import ordering
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "PTH", # prefer pathlib
    "S",   # bandit: this repo handles credentials and subprocess calls
]
ignore = [
    "S101", # assert is fine in tests

    # 这个包 target py39 并统一使用 typing.Optional/Dict/List。
    # 改成 PEP 604/585 写法要动 25+ 处注解（含最关键的原子发布路径），
    # 是纯粹的风格 churn、零功能收益。保持现有风格一致比追新写法重要。
    "UP006", # non-pep585-annotation: Dict -> dict
    "UP035", # deprecated-import: typing.Dict 等
    "UP045", # non-pep604-annotation-optional: Optional[X] -> X | None
]

[tool.ruff.lint.per-file-ignores]
# subprocess with a caller-supplied CLI path is the whole point of aliyun_cli.
"src/dataset_sink/aliyun_cli.py" = ["S603"]

# os.rename / os.replace 在这里是刻意的：整个发布协议依赖 rename 的原子性，
# 而 os.replace 的文档明确写了 POSIX 上原子。Path.replace 虽然等价，
# 但读代码时不如 os.replace 直白地表达「这一步必须原子」。
"src/dataset_sink/materializer.py" = ["PTH104", "PTH105"]
"src/dataset_sink/ingest.py" = ["PTH105"]

"tests/**" = ["S105", "S106", "S108"]

