name: Dataset release

# 数据集发布是有意为之的动作，不由代码推送触发。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: |
          发布方式。
          cpfs-ingest：CPFS 上处理完的新数据，还没有 Commit（scan→archive→commit→certify）
          cpfs-adopt：纳管已有 CPFS 目录，保留原目录（scan→archive→commit→materialize）
          oss-ingest：数据本来就在对象存储上（scan-oss→commit→materialize，全程不搬字节）
          certify：CPFS staging 已就绪且 Commit 已存在，零拷贝发布
          materialize：从 lakeFS 拷贝到 CPFS
        required: true
        default: cpfs-ingest
        type: choice
        options: [cpfs-ingest, cpfs-adopt, oss-ingest, certify, materialize]
      transfer_mode:
        description: |
          字节搬运方式。dataflow 调用 CPFS Import/Export；client 仅用于未完成
          DataFlow 绑定的兼容环境。生产默认使用 dataflow，找不到覆盖路径时直接失败。
        required: true
        default: dataflow
        type: choice
        options: [dataflow, client]
      dataset:
        description: 数据集名（如 robotics）
        required: true
      repository:
        description: lakeFS Repository
        required: true
      ref:
        description: |
          materialize/certify：已存在的 lakeFS Tag 或 Commit（严禁 Branch 名或 latest）
          cpfs-ingest/oss-ingest：本次要**创建**的 Tag 名（同名已存在会失败，不会覆盖）
        required: true
      prepared_dir:
        description: CPFS staging 目录（cpfs-ingest 与 certify 必填）
        required: false
      archive_prefix:
        description: 对象存储归档前缀（cpfs-ingest 必填），如 staging/batch-20260802-001
        required: false
      source_bucket:
        description: 存量数据所在的 OSS 桶（oss-ingest 必填）。必须是注册过的数据源
        required: false
      source_prefix:
        description: 存量数据所在的前缀（oss-ingest 必填），如 legacy/robotics
        required: false
      manifest_path:
        description: |
          Manifest 路径（materialize 与 certify 必填；
          cpfs-ingest 由 scan 生成，oss-ingest 由 scan-oss 生成）
        required: false
      no_digest:
        description: |
          oss-ingest：跳过 SHA-256 计算。快，但发布出来的 release **永久**失去深度校验能力
          （manifest 随发布固化，事后补不上）。仅用于摸底，正式发布不要开。
        required: false
        type: boolean
        default: false
      paimon_snapshot_id:
        description: Paimon Snapshot ID
        required: false
      lakefs_branch:
        description: import 的目标分支
        required: false
        default: main

permissions:
  contents: read
  id-token: write

# 同一个数据集不能并发发布：两个流水线同时写同一个 commit 目录会互相破坏。
concurrency:
  group: dataset-release-${{ inputs.dataset }}
  cancel-in-progress: false

env:
  ALIBABA_CLOUD_OIDC_AUDIENCE: github-actions
  MANIFEST_ARTIFACT: manifest-${{ github.run_id }}

jobs:
  # ---------------------------------------------------------------------------
  # 前置检查：把「配置没做好」和「数据有问题」区分开。
  # 没有这一步，缺一个变量会表现为流水线中段莫名其妙的失败。
  # ---------------------------------------------------------------------------
  preflight:
    name: 前置检查
    runs-on: ubuntu-latest
    outputs:
      cpfs_runner: ${{ steps.check.outputs.cpfs_runner }}
      pai_dataset_id: ${{ steps.check.outputs.pai_dataset_id }}
    steps:
      - uses: actions/checkout@v4

      - name: 校验 ref 不是可变引用
        run: |
          set -euo pipefail
          ref='${{ inputs.ref }}'
          case "$ref" in
            latest|main|master|dev|develop|HEAD)
              echo "::error::ref='$ref' 是可变引用。数据集版本必须对应不可变的 Commit 或 Tag。"
              exit 1
              ;;
          esac

      - name: 校验各模式必填参数
        run: |
          set -euo pipefail
          mode='${{ inputs.mode }}'
          case "$mode" in
            cpfs-ingest|cpfs-adopt)
              [ -n '${{ inputs.prepared_dir }}' ]   || { echo "::error::${mode} 需要 prepared_dir"; exit 1; }
              [ -n '${{ inputs.archive_prefix }}' ] || { echo "::error::${mode} 需要 archive_prefix"; exit 1; }
              ;;
            oss-ingest)
              [ -n '${{ inputs.source_bucket }}' ] || { echo "::error::oss-ingest 需要 source_bucket"; exit 1; }
              [ -n '${{ inputs.source_prefix }}' ] || { echo "::error::oss-ingest 需要 source_prefix"; exit 1; }
              # oss-ingest 不接受 prepared_dir / archive_prefix：数据本来就在对象存储上，
              # 没有 staging 目录，也不需要归档。填了说明用错了模式，早说比让它静默无效好。
              [ -z '${{ inputs.prepared_dir }}' ] || { echo "::error::oss-ingest 不用 prepared_dir——数据已在对象存储上，没有 staging 目录"; exit 1; }
              [ -z '${{ inputs.archive_prefix }}' ] || { echo "::error::oss-ingest 不用 archive_prefix——存量数据不需要再归档一遍，零拷贝 import 直接引用原位置"; exit 1; }
              ;;
            certify)
              [ -n '${{ inputs.prepared_dir }}' ]  || { echo "::error::certify 需要 prepared_dir"; exit 1; }
              [ -n '${{ inputs.manifest_path }}' ] || { echo "::error::certify 需要 manifest_path"; exit 1; }
              ;;
            materialize)
              [ -n '${{ inputs.manifest_path }}' ] || { echo "::error::materialize 需要 manifest_path"; exit 1; }
              ;;
          esac

      # 数据源注册表校验：oss-ingest 的来源必须是注册过的、内容稳定的位置。
      # 单独成 step 而不是塞进上面的 case——heredoc 的结束符必须落在
      # YAML 块标量的基准缩进上，嵌在 case 里就永远不会闭合。
      - uses: actions/setup-python@v5
        if: inputs.mode == 'oss-ingest'
        with:
          python-version: "3.11"

      - name: 校验数据源已注册且可作为 Commit 来源
        if: inputs.mode == 'oss-ingest'
        env:
          SOURCE_BUCKET: ${{ inputs.source_bucket }}
          SOURCE_PREFIX: ${{ inputs.source_prefix }}
        run: |
          set -euo pipefail
          PYTHONPATH=src python - <<'PY'
          import os
          from pathlib import Path

          from dataset_sink.registry import load_registry

          registry = load_registry(Path("deploy/data-sources.json"))
          source = registry.assert_commit_source(
              os.environ["SOURCE_BUCKET"], os.environ["SOURCE_PREFIX"]
          )
          print(f"数据源 {source.name}（{source.location}，mode={source.mode}）可作为 Commit 来源")
          PY

      - name: 校验必需的仓库变量
        id: check
        env:
          MODE: ${{ inputs.mode }}
          INPUT_DATASET: ${{ inputs.dataset }}
          ALIBABA_CLOUD_OIDC_PROVIDER_ARN: ${{ vars.ALIBABA_CLOUD_OIDC_PROVIDER_ARN }}
          ALIBABA_CLOUD_REGION: ${{ vars.ALIBABA_CLOUD_REGION }}
          MATERIALIZER_ROLE_ARN: ${{ vars.MATERIALIZER_ROLE_ARN }}
          REGISTER_ROLE_ARN: ${{ vars.REGISTER_ROLE_ARN }}
          PAI_DATASET_ID: ${{ vars.PAI_DATASET_ID }}
          PAI_DATASET_IDS_JSON: ${{ vars.PAI_DATASET_IDS_JSON }}
          CPFS_FILESYSTEM_ID: ${{ vars.CPFS_FILESYSTEM_ID }}
          CPFS_TARGET_ROOT: ${{ vars.CPFS_TARGET_ROOT }}
          CPFS_MOUNT_PREFIX: ${{ vars.CPFS_MOUNT_PREFIX }}
          ARCHIVE_BUCKET: ${{ vars.ARCHIVE_BUCKET }}
          ARCHIVE_ENDPOINT_URL: ${{ vars.ARCHIVE_ENDPOINT_URL }}
          ARCHIVE_OBJECT_STORE_URI: ${{ vars.ARCHIVE_OBJECT_STORE_URI }}
          # 区域级 OSS S3 兼容端点，同 region 的桶共用。留空时回落到归档桶的端点，
          # 因为两者本来就是同一个地址，只是命名上一个偏归档、一个偏通用。
          OSS_ENDPOINT_URL: ${{ vars.OSS_ENDPOINT_URL || vars.ARCHIVE_ENDPOINT_URL }}
          LAKEFS_API_ENDPOINT: ${{ vars.LAKEFS_API_ENDPOINT }}
          LAKEFS_S3_ENDPOINT: ${{ vars.LAKEFS_S3_ENDPOINT }}
        run: |
          set -euo pipefail
          missing=""
          for v in ALIBABA_CLOUD_OIDC_PROVIDER_ARN ALIBABA_CLOUD_REGION \
                   MATERIALIZER_ROLE_ARN REGISTER_ROLE_ARN \
                   CPFS_FILESYSTEM_ID CPFS_TARGET_ROOT; do
            eval "value=\${$v:-}"
            [ -n "$value" ] || missing="$missing $v"
          done
          if [ '${{ inputs.transfer_mode }}' = 'dataflow' ] && [ -z "$CPFS_MOUNT_PREFIX" ]; then
            missing="$missing CPFS_MOUNT_PREFIX"
          fi
          # 两种 CPFS 接入都要先归档，再 import 进 lakeFS。cpfs-adopt 还要从
          # lakeFS 重新物化，以保留原目录不被 certify 的 rename 移走。
          if [ "$MODE" = "cpfs-ingest" ] || [ "$MODE" = "cpfs-adopt" ]; then
            for v in ARCHIVE_BUCKET ARCHIVE_ENDPOINT_URL ARCHIVE_OBJECT_STORE_URI LAKEFS_API_ENDPOINT; do
              eval "value=\${$v:-}"
              [ -n "$value" ] || missing="$missing $v"
            done
          fi
          if [ "$MODE" = "cpfs-adopt" ] && [ -z "$LAKEFS_S3_ENDPOINT" ]; then
            missing="$missing LAKEFS_S3_ENDPOINT"
          fi

          # 多数据集优先使用 JSON 映射；未配置时兼容原来的单一 PAI_DATASET_ID。
          # 用户只能提交 dataset 短名称，不能从表单注入任意 Dataset ID。
          pai_dataset_id=$(PYTHONPATH=src python3 - <<'PY'
          import os

          from dataset_sink.catalog import resolve_pai_dataset_id

          print(resolve_pai_dataset_id(
              os.environ["INPUT_DATASET"],
              os.environ.get("PAI_DATASET_IDS_JSON", ""),
              fallback=os.environ.get("PAI_DATASET_ID"),
          ))
          PY
          )
          # oss-ingest 不归档，所以不要 ARCHIVE_*；但要读源桶、要 import、
          # 之后还要从 lakeFS 的 S3 Gateway 取数落到 CPFS。
          if [ "$MODE" = "oss-ingest" ]; then
            for v in OSS_ENDPOINT_URL LAKEFS_API_ENDPOINT LAKEFS_S3_ENDPOINT; do
              eval "value=\${$v:-}"
              [ -n "$value" ] || missing="$missing $v"
            done
          fi
          if [ -n "$missing" ]; then
            echo "::error::缺少仓库变量:$missing。见 docs/runbook.md「配置发布流水线」。"
            exit 1
          fi

          # CPFS 在 VPC 内，GitHub 托管 runner 到不了，必须自托管 runner 或 ACK Job。
          runner='${{ vars.CPFS_RUNNER_LABEL }}'
          if [ -z "$runner" ]; then
            echo "::error::未配置 CPFS_RUNNER_LABEL。沉降与归档都要挂载 CPFS，GitHub 托管 runner 访问不了 VPC 内的 CPFS。"
            exit 1
          fi
          echo "cpfs_runner=$runner" >> "$GITHUB_OUTPUT"
          echo "pai_dataset_id=$pai_dataset_id" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # cpfs-ingest ①②：扫描 + 归档。
  # 需要挂载 CPFS，用 DatasetMaterializerRole（它有 staging 前缀的 OSS 写权限，
  # 但被显式 Deny 了注册 PAI 版本和提交训练）。
  # ---------------------------------------------------------------------------
  ingest-archive:
    name: 扫描并归档到对象存储
    if: inputs.mode == 'cpfs-ingest' || inputs.mode == 'cpfs-adopt'
    needs: preflight
    runs-on: ${{ needs.preflight.outputs.cpfs_runner }}
    outputs:
      manifest_sha256: ${{ steps.scan.outputs.manifest_sha256 }}
      object_store_uri: ${{ steps.archive.outputs.object_store_uri }}
      object_store_prefix: ${{ steps.archive.outputs.object_store_prefix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[all]'

      # scan 不需要任何云权限，放在假设角色之前，
      # 这样「staging 不干净」这类错误不会白白占用一次凭证。
      - name: 扫描 staging 并生成 manifest
        id: scan
        run: |
          set -euo pipefail
          dataset-sink scan '${{ inputs.prepared_dir }}' \
            --output "$RUNNER_TEMP/manifest.jsonl" | tee "$RUNNER_TEMP/scan.json"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          d = json.load(open(os.environ["RUNNER_TEMP"] + "/scan.json"))
          print(f"manifest_sha256={d['manifest_sha256']}")
          print(f"file_count={d['file_count']}")
          PY

      - name: 假设 DatasetMaterializerRole
        uses: aliyun/configure-aliyun-credentials-action@v1
        with:
          role-to-assume: ${{ vars.MATERIALIZER_ROLE_ARN }}
          oidc-provider-arn: ${{ vars.ALIBABA_CLOUD_OIDC_PROVIDER_ARN }}
          audience: ${{ env.ALIBABA_CLOUD_OIDC_AUDIENCE }}
          role-session-name: archive-${{ github.run_id }}

      # dataflow 是生产默认：由 CPFS 服务端执行 Export；如果 prepared_dir 没有被
      # DataFlow 覆盖则立即失败，不静默回退到 runner 搬运。client 只用于迁移期兼容。
      - name: 归档到对象存储
        id: archive
        env:
          ARCHIVE_OBJECT_STORE_URI: ${{ vars.ARCHIVE_OBJECT_STORE_URI }}
          INPUT_ARCHIVE_PREFIX: ${{ inputs.archive_prefix }}
        run: |
          set -euo pipefail
          args=(archive '${{ inputs.prepared_dir }}' \
            --manifest "$RUNNER_TEMP/manifest.jsonl" \
            --prefix '${{ inputs.archive_prefix }}')

          if [ '${{ inputs.transfer_mode }}' = 'dataflow' ]; then
            args+=(--via dataflow
              --cpfs-filesystem-id '${{ vars.CPFS_FILESYSTEM_ID }}'
              --cpfs-mount-prefix '${{ vars.CPFS_MOUNT_PREFIX }}'
              --region '${{ vars.ALIBABA_CLOUD_REGION }}')
          else
            args+=(--via client
              --target oss
              --bucket '${{ vars.ARCHIVE_BUCKET }}'
              --endpoint-url '${{ vars.ARCHIVE_ENDPOINT_URL }}')
          fi

          dataset-sink "${args[@]}" | tee "$RUNNER_TEMP/archive.json"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          result = json.load(open(os.environ["RUNNER_TEMP"] + "/archive.json"))
          physical = str(result.get("object_store_uri") or "").strip()
          if physical:
              # DataFlow 回报 oss://，lakeFS 的 OSS adapter 要求 s3://。
              if physical.startswith("oss://"):
                  physical = "s3://" + physical[len("oss://"):]
              scheme, rest = physical.split("://", 1)
              bucket, _, prefix = rest.strip("/").partition("/")
              print(f"object_store_uri={scheme}://{bucket}")
              print(f"object_store_prefix={prefix}")
          else:
              print(f"object_store_uri={os.environ['ARCHIVE_OBJECT_STORE_URI'].rstrip('/')}")
              print(f"object_store_prefix={os.environ['INPUT_ARCHIVE_PREFIX'].strip('/')}")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.MANIFEST_ARTIFACT }}
          path: ${{ runner.temp }}/manifest.jsonl
          retention-days: 30

  # ---------------------------------------------------------------------------
  # oss-ingest ①：扫描存量前缀，生成 manifest。
  #
  # **这条路径没有 archive 步骤**，那正是它的价值：字节已经在持久位置上，
  # 而 lakeFS import 又是零拷贝的，所以「存量 OSS 数据 → Commit」全程不搬一个
  # 字节。cpfs-ingest 必须先归档，是因为 CPFS staging 不是持久位置。
  #
  # 但**读还是要读一遍**：对象存储不提供 SHA-256，要拿到校验能力只能把每个
  # 对象读一遍算摘要。这是唯一的一次全量读，之后 verify --deep 都在 CPFS 上做。
  # 因此这个 job 跑在 VPC 内的 runner 上——走 OSS 内网端点，而不是从
  # GitHub 托管 runner 走公网把整个数据集拉一遍。
  # ---------------------------------------------------------------------------
  oss-scan:
    name: 扫描存量对象存储前缀
    if: inputs.mode == 'oss-ingest'
    needs: preflight
    runs-on: ${{ needs.preflight.outputs.cpfs_runner }}
    outputs:
      manifest_sha256: ${{ steps.scan.outputs.manifest_sha256 }}
      file_count: ${{ steps.scan.outputs.file_count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[all]'

      # 只需要读注册过的前缀。materializer 角色的 ReadRegisteredDataSources
      # 正是为此存在——它读不了整个桶，只读注册表里那些前缀。
      - name: 假设 DatasetMaterializerRole
        uses: aliyun/configure-aliyun-credentials-action@v1
        with:
          role-to-assume: ${{ vars.MATERIALIZER_ROLE_ARN }}
          oidc-provider-arn: ${{ vars.ALIBABA_CLOUD_OIDC_PROVIDER_ARN }}
          audience: ${{ env.ALIBABA_CLOUD_OIDC_AUDIENCE }}
          role-session-name: oss-scan-${{ github.run_id }}

      - name: scan-oss
        id: scan
        run: |
          set -euo pipefail
          # 用数组而不是字符串拼可选 flag：字符串要靠不加引号的展开才能拆成
          # 多个参数，而那样 shellcheck 会报 SC2086，且带空格的值会被拆错。
          # 数组从一开始就非空，也就不会踩 set -u 下空数组展开的坑。
          args=(
            --source oss
            --bucket '${{ inputs.source_bucket }}'
            --endpoint-url '${{ vars.OSS_ENDPOINT_URL || vars.ARCHIVE_ENDPOINT_URL }}'
            --prefix '${{ inputs.source_prefix }}'
            # --destination 必须与随后 commit --destination 完全一致，否则
            # manifest 里的 source_key 与 Commit 内的实际路径对不上，
            # materialize 会全量 NoSuchKey——而那时 Commit 和 Tag 都已经建好了。
            --destination 'datasets/${{ inputs.dataset }}'
            --registry deploy/data-sources.json
            --output "$RUNNER_TEMP/manifest.jsonl"
          )
          if [ '${{ inputs.no_digest }}' = 'true' ]; then
            echo "::warning::--no-digest 已开启。这次发布的 release 将**永久**没有 SHA-256，verify --deep 永远无法校验它。"
            args+=(--no-digest)
          fi

          dataset-sink scan-oss "${args[@]}" | tee "$RUNNER_TEMP/scan.json"

          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          d = json.load(open(os.environ["RUNNER_TEMP"] + "/scan.json"))
          print(f"manifest_sha256={d['manifest_sha256']}")
          print(f"file_count={d['file_count']}")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.MANIFEST_ARTIFACT }}
          path: ${{ runner.temp }}/manifest.jsonl
          retention-days: 30

  # ---------------------------------------------------------------------------
  # cpfs-ingest ③：lakeFS 零拷贝 import 产生 Commit。
  #
  # 这个 job **不假设任何阿里云角色**——它只需要 lakeFS 凭证。
  # 单独成 job 而不是并进上一个，就是为了让它拿不到 OSS 写权限：
  # 建 Commit 这个动作不需要碰数据，也就不该有碰数据的能力。
  # 它也不需要 CPFS，所以跑在托管 runner 上。
  # ---------------------------------------------------------------------------
  # 两条 ingest 路径共用这一个 job。差别只有「import 的源在哪」：
  #   cpfs-ingest  刚归档进去的 ARCHIVE_OBJECT_STORE_URI + archive_prefix
  #   oss-ingest   数据本来就在的 oss://<source_bucket> + source_prefix
  # 建 Commit 这个动作本身在两种模式下完全一样，所以不复制一份。
  ingest-commit:
    name: lakeFS 零拷贝 import
    needs: [preflight, ingest-archive, oss-scan]
    # 每次只会有一条 ingest 前置真正跑，另一条是 skipped，必须显式接受。
    if: >-
      ${{ !cancelled()
      && (inputs.mode == 'cpfs-ingest' || inputs.mode == 'cpfs-adopt' || inputs.mode == 'oss-ingest')
      && needs.preflight.result == 'success'
      && (needs.ingest-archive.result == 'success' || needs.ingest-archive.result == 'skipped')
      && (needs.oss-scan.result == 'success' || needs.oss-scan.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # 刻意不要 id-token：这一步不需要阿里云身份
    outputs:
      commit_id: ${{ steps.commit.outputs.commit_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[lakefs]'

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.MANIFEST_ARTIFACT }}
          path: ${{ runner.temp }}

      - name: import 并产生 Commit
        id: commit
        env:
          LAKEFS_API_ENDPOINT: ${{ vars.LAKEFS_API_ENDPOINT }}
          LAKEFS_ACCESS_KEY_ID: ${{ secrets.LAKEFS_ACCESS_KEY_ID }}
          LAKEFS_SECRET_ACCESS_KEY: ${{ secrets.LAKEFS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          args=(
            --repository '${{ inputs.repository }}'
            --branch '${{ inputs.lakefs_branch }}'
            --destination 'datasets/${{ inputs.dataset }}'
            --manifest "$RUNNER_TEMP/manifest.jsonl"
            --tag '${{ inputs.ref }}'
          )

          if [ '${{ inputs.mode }}' = 'oss-ingest' ]; then
            # **必须是 s3:// 而不是 oss://**。scheme 要匹配 lakeFS 的 blockstore
            # adapter 类型，不是云厂商名字：OSS 是通过 lakeFS 的 s3 adapter 访问的。
            # 2026-08-03 真实 lakeFS 1.84.1 + OSS 后端实测，oss:// 会在服务端报
            # `invalid storage scheme oss: invalid address`。commit 现在会在本地先拦。
            args+=(--object-store-uri 's3://${{ inputs.source_bucket }}')
            args+=(--prefix '${{ inputs.source_prefix }}')
            # 只有 oss-ingest 走 --registry。preflight 已经查过一次，这里再查
            # 是因为两者之间隔着一次 scan，注册表有可能在中间被改。
            args+=(--registry deploy/data-sources.json)
          else
            # 不能重新用用户输入的 archive_prefix：DataFlow 的真实 OSS 落点由
            # FileSystemPath ↔ SourceStorage 绑定决定，以上一步回报为准。
            args+=(--object-store-uri '${{ needs.ingest-archive.outputs.object_store_uri }}')
            args+=(--prefix '${{ needs.ingest-archive.outputs.object_store_prefix }}')
            # cpfs-ingest **刻意不传 --registry**：它的来源是本流水线上一步刚写进去的
            # staging 前缀（如 staging/batch-20260802-001），而注册表登记的是
            # 归档前缀（如 releases/）。传了会因为「staging 没注册」误报失败，
            # 而那个位置的内容稳定性由「刚归档完、只有本流水线写过」保证，
            # 不需要注册表来判断。
          fi

          snapshot='${{ inputs.paimon_snapshot_id }}'
          [ -n "$snapshot" ] && args+=(--paimon-snapshot-id "$snapshot")

          dataset-sink commit "${args[@]}" | tee "$RUNNER_TEMP/commit.json"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          d = json.load(open(os.environ["RUNNER_TEMP"] + "/commit.json"))
          print(f"commit_id={d['commit_id']}")
          PY

  # ---------------------------------------------------------------------------
  # 发布：把数据变成 CPFS 上不可变的 release。
  #
  # 三种模式在这里汇合：cpfs-ingest 用上一步产生的 Commit 走 certify，
  # certify 用调用者给的 Commit，materialize 从 lakeFS 拷贝。
  # ---------------------------------------------------------------------------
  publish:
    name: 发布 CPFS release
    needs: [preflight, ingest-commit]
    # ingest-commit 在非 cpfs-ingest 模式下是 skipped，默认会连带跳过本 job，
    # 所以要显式接受 skipped。
    if: >-
      ${{ !cancelled()
      && needs.preflight.result == 'success'
      && (needs.ingest-commit.result == 'success' || needs.ingest-commit.result == 'skipped') }}
    runs-on: ${{ needs.preflight.outputs.cpfs_runner }}
    outputs:
      release_dir: ${{ steps.publish.outputs.release_dir }}
      commit: ${{ steps.publish.outputs.commit }}
      manifest_sha256: ${{ steps.publish.outputs.manifest_sha256 }}
    env:
      # 两条 ingest 路径的 Commit 都来自 import，其余模式来自调用者输入。
      RESOLVED_COMMIT: >-
        ${{ (inputs.mode == 'cpfs-ingest' || inputs.mode == 'cpfs-adopt' || inputs.mode == 'oss-ingest')
        && needs.ingest-commit.outputs.commit_id || inputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[all]'

      - name: 取回 scan 生成的 manifest
        if: inputs.mode == 'cpfs-ingest' || inputs.mode == 'cpfs-adopt' || inputs.mode == 'oss-ingest'
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.MANIFEST_ARTIFACT }}
          path: ${{ runner.temp }}

      - name: 假设 DatasetMaterializerRole
        uses: aliyun/configure-aliyun-credentials-action@v1
        with:
          role-to-assume: ${{ vars.MATERIALIZER_ROLE_ARN }}
          oidc-provider-arn: ${{ vars.ALIBABA_CLOUD_OIDC_PROVIDER_ARN }}
          audience: ${{ env.ALIBABA_CLOUD_OIDC_AUDIENCE }}
          role-session-name: publish-${{ github.run_id }}

      - name: 发布
        id: publish
        env:
          LAKEFS_API_ENDPOINT: ${{ vars.LAKEFS_API_ENDPOINT }}
          LAKEFS_S3_ENDPOINT: ${{ vars.LAKEFS_S3_ENDPOINT }}
          LAKEFS_ACCESS_KEY_ID: ${{ secrets.LAKEFS_ACCESS_KEY_ID }}
          LAKEFS_SECRET_ACCESS_KEY: ${{ secrets.LAKEFS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          target_root='${{ vars.CPFS_TARGET_ROOT }}'
          snapshot='${{ inputs.paimon_snapshot_id }}'

          # 每个分支各自组一整份参数数组。这样数组永不为空——空数组在
          # set -u 下展开会报错（bash 4.4 之前），而自托管 runner 的 bash
          # 版本是我们控制不了的。
          if [ '${{ inputs.mode }}' = 'oss-ingest' ] || [ '${{ inputs.mode }}' = 'cpfs-adopt' ]; then
            # 从 lakeFS 的 S3 Gateway 按 Commit 内路径取数落到 CPFS。
            #
            # 用 --commit 而不是 --ref：Commit 是上一步 import 刚产生的，
            # 已经是不可变标识，不需要再解析一次。
            #
            # oss-ingest 不传 --commit-prefix：scan-oss 的 source_key 已经是
            # Commit 内路径。cpfs-adopt 的 scan source_key 是源目录内相对路径，
            # 所以下面只为它补 datasets/<dataset>。
            args=(materialize
              --dataset '${{ inputs.dataset }}'
              --repository '${{ inputs.repository }}'
              --commit "$RESOLVED_COMMIT"
              --lakefs-tag '${{ inputs.ref }}'
              --manifest "$RUNNER_TEMP/manifest.jsonl"
              --source lakefs-s3
              --target-root "$target_root"
              --workers 32
            )
            if [ '${{ inputs.mode }}' = 'cpfs-adopt' ]; then
              # scan(CPFS) 的 source_key 是源目录内相对路径，而 Commit import
              # 把它们放在 datasets/<dataset>/ 下；物化时必须补上这个差值。
              args+=(--commit-prefix 'datasets/${{ inputs.dataset }}')
            fi
          elif [ '${{ inputs.mode }}' = 'materialize' ]; then
            args=(materialize
              --dataset '${{ inputs.dataset }}'
              --repository '${{ inputs.repository }}'
              --ref '${{ inputs.ref }}'
              --lakefs-tag '${{ inputs.ref }}'
              --manifest '${{ inputs.manifest_path }}'
              --source lakefs-s3
              --target-root "$target_root"
              --workers 32
            )
          else
            if [ '${{ inputs.mode }}' = 'cpfs-ingest' ]; then
              manifest="$RUNNER_TEMP/manifest.jsonl"
            else
              manifest='${{ inputs.manifest_path }}'
            fi
            args=(certify
              --prepared-dir '${{ inputs.prepared_dir }}'
              --target-root "$target_root"
              --dataset '${{ inputs.dataset }}'
              --repository '${{ inputs.repository }}'
              --source-reference '${{ inputs.ref }}'
              --commit "$RESOLVED_COMMIT"
              --lakefs-tag '${{ inputs.ref }}'
              --manifest "$manifest"
            )
          fi

          # materialize 的生产路径通过 CPFS DataFlow Import 预热；Import 完成后
          # CLI 仍执行 Manifest/SHA-256 校验和原子 rename。找不到匹配的 DataFlow
          # 会 fail-closed，不会偷偷回退到客户端逐文件复制。
          if [ "${args[0]}" = 'materialize' ] && [ '${{ inputs.transfer_mode }}' = 'dataflow' ]; then
            args+=(--via dataflow
              --cpfs-filesystem-id '${{ vars.CPFS_FILESYSTEM_ID }}'
              --cpfs-mount-prefix '${{ vars.CPFS_MOUNT_PREFIX }}'
              --region '${{ vars.ALIBABA_CLOUD_REGION }}')
          fi

          [ -n "$snapshot" ] && args+=(--paimon-snapshot-id "$snapshot")

          dataset-sink "${args[@]}" | tee "$RUNNER_TEMP/release.json"

          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          d = json.load(open(os.environ["RUNNER_TEMP"] + "/release.json"))
          r = d.get("release", d)
          print(f"release_dir={r['release_path']}")
          print(f"commit={r['commit_id']}")
          print(f"manifest_sha256={r['manifest_sha256']}")
          PY

      # 深度校验重算全部 SHA-256。发布门禁值得这个代价：
      # 它是「数据确实完整落盘」和「元数据说它完整」之间的区别。
      - name: 深度校验
        run: dataset-sink verify '${{ steps.publish.outputs.release_dir }}' --deep

  # ---------------------------------------------------------------------------
  # 生成注册请求：不需要任何云权限，产物是可人工审阅的 JSON。
  # ---------------------------------------------------------------------------
  build-request:
    name: 生成注册请求
    needs: [preflight, publish]
    runs-on: ${{ needs.preflight.outputs.cpfs_runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .

      - name: 生成 CreateDatasetVersion 请求
        env:
          DATA_SOURCE_TYPE: ${{ vars.PAI_DATA_SOURCE_TYPE || 'CPFS' }}
          PROTOCOL_SERVICE_ID: ${{ vars.CPFS_PROTOCOL_SERVICE_ID }}
        run: |
          set -euo pipefail
          release_dir='${{ needs.publish.outputs.release_dir }}'
          fs_path="${release_dir#${{ vars.CPFS_MOUNT_PREFIX }}}"

          # Uri 的 scheme 必须与 DataSourceType 严格对应，否则 PAI 报
          # Uri format error。2026-08-03 真实账号实测：CPFS 只接受 cpfs://，
          # 官方文档写的 nas:// 是错的。
          case "$DATA_SOURCE_TYPE" in
            CPFS)   scheme=cpfs ;;
            BMCPFS) scheme=bmcpfs ;;
            NAS)    scheme=nas ;;
            *) echo "::error::不支持的 PAI_DATA_SOURCE_TYPE=$DATA_SOURCE_TYPE"; exit 1 ;;
          esac

          # CPFS 2.0（fsid 为 cpfs-<16 位>）的路径里要带协议服务 ID；
          # 1.0 和通用 NAS 不需要，留空即可。
          svc=""
          [ -n "$PROTOCOL_SERVICE_ID" ] && svc="/$PROTOCOL_SERVICE_ID"

          dataset-sink pai-request "$release_dir" \
            --dataset-id '${{ needs.preflight.outputs.pai_dataset_id }}' \
            --region '${{ vars.ALIBABA_CLOUD_REGION }}' \
            --filesystem-id '${{ vars.CPFS_FILESYSTEM_ID }}' \
            --filesystem-path "$fs_path" \
            --data-source-type "$DATA_SOURCE_TYPE" \
            ${PROTOCOL_SERVICE_ID:+--protocol-service-id "$PROTOCOL_SERVICE_ID"} \
            --uri "${scheme}://${{ vars.CPFS_FILESYSTEM_ID }}.${{ vars.ALIBABA_CLOUD_REGION }}${svc}${fs_path}/" \
            --output "$RUNNER_TEMP/pai-request.json"
          cat "$RUNNER_TEMP/pai-request.json"

      - uses: actions/upload-artifact@v7
        with:
          name: pai-request-${{ needs.publish.outputs.commit }}
          path: ${{ runner.temp }}/pai-request.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # dry-run：让审批人看到将要发出的**确切**请求，而不是描述。
  # ---------------------------------------------------------------------------
  register-dry-run:
    name: 注册 dry-run
    needs: [publish, build-request]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .

      - uses: actions/download-artifact@v4
        with:
          name: pai-request-${{ needs.publish.outputs.commit }}
          path: ${{ runner.temp }}

      - name: 假设 DatasetRegisterRole
        uses: aliyun/configure-aliyun-credentials-action@v1
        with:
          role-to-assume: ${{ vars.REGISTER_ROLE_ARN }}
          oidc-provider-arn: ${{ vars.ALIBABA_CLOUD_OIDC_PROVIDER_ARN }}
          audience: ${{ env.ALIBABA_CLOUD_OIDC_AUDIENCE }}
          role-session-name: register-dryrun-${{ github.run_id }}

      # 不带 --execute：只走 aliyun --dryrun，不改动 PAI。
      - name: dry-run
        run: |
          dataset-sink register-pai "$RUNNER_TEMP/pai-request.json" \
            --region '${{ vars.ALIBABA_CLOUD_REGION }}'

  # ---------------------------------------------------------------------------
  # 真正注册：需要人工审批。
  # ---------------------------------------------------------------------------
  register:
    name: 注册 Dataset Version
    needs: [publish, build-request, register-dry-run]
    runs-on: ubuntu-latest
    environment: dataset-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .

      - uses: actions/download-artifact@v4
        with:
          name: pai-request-${{ needs.publish.outputs.commit }}
          path: ${{ runner.temp }}

      - name: 假设 DatasetRegisterRole
        uses: aliyun/configure-aliyun-credentials-action@v1
        with:
          role-to-assume: ${{ vars.REGISTER_ROLE_ARN }}
          oidc-provider-arn: ${{ vars.ALIBABA_CLOUD_OIDC_PROVIDER_ARN }}
          audience: ${{ env.ALIBABA_CLOUD_OIDC_AUDIENCE }}
          role-session-name: register-${{ github.run_id }}

      # 幂等：执行前按 lakeFS Commit 查重，已存在则返回 EXISTS 而非重复创建；
      # 若同 Commit 的既有版本 manifest_sha256 不一致，会直接报错拒绝执行。
      - name: 注册
        run: |
          dataset-sink register-pai "$RUNNER_TEMP/pai-request.json" \
            --region '${{ vars.ALIBABA_CLOUD_REGION }}' \
            --execute | tee "$RUNNER_TEMP/register-result.json"

      - uses: actions/upload-artifact@v7
        with:
          name: register-result-${{ needs.publish.outputs.commit }}
          path: ${{ runner.temp }}/register-result.json
          retention-days: 90

  # ---------------------------------------------------------------------------
  # 冒烟训练：验证「注册出来的版本确实能被挂载并通过门禁」。
  # 用 DlcSubmitRole——它不能改数据版本。
  # ---------------------------------------------------------------------------
  smoke-test:
    name: 冒烟训练作业
    needs: [preflight, publish, register]
    if: ${{ vars.SMOKE_TEST_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 假设 DlcSubmitRole
        uses: aliyun/configure-aliyun-credentials-action@v1
        with:
          role-to-assume: ${{ vars.DLC_SUBMIT_ROLE_ARN }}
          oidc-provider-arn: ${{ vars.ALIBABA_CLOUD_OIDC_PROVIDER_ARN }}
          audience: ${{ env.ALIBABA_CLOUD_OIDC_AUDIENCE }}
          role-session-name: smoke-${{ github.run_id }}

      - name: 渲染并提交 DLC Job
        env:
          PAI_WORKSPACE_ID: ${{ vars.PAI_WORKSPACE_ID }}
          PAI_RESOURCE_ID: ${{ vars.PAI_RESOURCE_ID }}
          PAI_DATASET_ID: ${{ needs.preflight.outputs.pai_dataset_id }}
          PAI_DATASET_VERSION: ${{ needs.publish.outputs.commit }}
          TRAINING_IMAGE: ${{ vars.TRAINING_IMAGE }}
          DLC_ECS_SPEC: ${{ vars.DLC_ECS_SPEC }}
          MANIFEST_SHA256: ${{ needs.publish.outputs.manifest_sha256 }}
          VPC_ID: ${{ vars.VPC_ID }}
          VSWITCH_ID: ${{ vars.VSWITCH_ID }}
          SECURITY_GROUP_ID: ${{ vars.SECURITY_GROUP_ID }}
        run: |
          set -euo pipefail
          envsubst < deploy/pai/dlc-create-job.template.json > "$RUNNER_TEMP/dlc-job.json"
          cat "$RUNNER_TEMP/dlc-job.json"
          aliyun pai-dlc CreateJob \
            --region "${{ vars.ALIBABA_CLOUD_REGION }}" \
            --body "$(cat "$RUNNER_TEMP/dlc-job.json")"
