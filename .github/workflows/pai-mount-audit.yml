name: PAI mount audit

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: pai-mount-audit
  cancel-in-progress: true

env:
  ALIBABA_CLOUD_OIDC_AUDIENCE: github-actions

jobs:
  audit:
    # 审计角色只信任 main 的 OIDC sub；手动从其他分支触发应明确跳过。
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .

      - name: 假设只读挂载审计角色
        uses: aliyun/configure-aliyun-credentials-action@v1
        with:
          role-to-assume: ${{ vars.PAI_MOUNT_AUDIT_ROLE_ARN }}
          oidc-provider-arn: ${{ vars.ALIBABA_CLOUD_OIDC_PROVIDER_ARN }}
          audience: ${{ env.ALIBABA_CLOUD_OIDC_AUDIENCE }}
          role-session-name: pai-mount-audit-${{ github.run_id }}

      - name: 审计 DLC 与 DSW 挂载
        env:
          REGION: ${{ vars.ALIBABA_CLOUD_REGION }}
          WORKSPACE_ID: ${{ vars.PAI_WORKSPACE_ID }}
          CPFS_USERS_URI: ${{ vars.CPFS_USERS_URI_PREFIX }}
          CPFS_SHARED_URI: ${{ vars.CPFS_SHARED_URI_PREFIX }}
        run: |
          set -euo pipefail
          set -- audit-pai-mounts \
            --workspace-id "$WORKSPACE_ID" \
            --region "$REGION" \
            --registry deploy/data-sources.json
          if [ -n "${CPFS_USERS_URI:-}" ]; then
            set -- "$@" --workspace-uri-prefix "$CPFS_USERS_URI"
          fi
          if [ -n "${CPFS_SHARED_URI:-}" ]; then
            set -- "$@" --workspace-uri-prefix "$CPFS_SHARED_URI"
          fi
          dataset-sink "$@" | tee "$RUNNER_TEMP/pai-mount-audit.json"

      - name: 上传审计结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pai-mount-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/pai-mount-audit.json
          if-no-files-found: warn
          retention-days: 90
