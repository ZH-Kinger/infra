name: Terraform

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/terraform.yml"]
  workflow_dispatch:
    inputs:
      target:
        description: "Environment layer to plan/apply"
        required: true
        default: dev-platform
        type: choice
        options:
          - dev-platform
          - dev-access
          - prod-platform
          - prod-access
          - all
      confirm_apply:
        description: "Apply the generated plans after Environment approval"
        required: true
        default: false
        type: boolean

# id-token: write 只是允许本 Job 取 GitHub OIDC token，
# 它本身不授予任何阿里云权限——权限完全由 RAM 角色的信任策略决定。
permissions:
  contents: read
  id-token: write
  pull-requests: write

# 基础设施变更不能并发：两条流水线同时 apply 会互相覆盖 state。
# cancel-in-progress 必须为 false，取消一个正在 apply 的 Job 会留下脏锁。
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.15.8"
  ALIBABA_CLOUD_OIDC_AUDIENCE: github-actions

jobs:
  select:
    name: Select environment layers
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          TARGET: ${{ inputs.target || 'all' }}
        run: |
          set -euo pipefail
          all='[{"dir":"infra/envs/dev/platform","layer":"dev-platform","tfvars_var":"TFVARS_DEV_PLATFORM_JSON","environment":"development","role_var":"ALIBABA_CLOUD_PLATFORM_APPLY_ROLE_ARN"},{"dir":"infra/envs/dev/access","layer":"dev-access","tfvars_var":"TFVARS_DEV_ACCESS_JSON","environment":"development","role_var":"ALIBABA_CLOUD_ACCESS_APPLY_ROLE_ARN"},{"dir":"infra/envs/prod/platform","layer":"prod-platform","tfvars_var":"TFVARS_PROD_PLATFORM_JSON","environment":"production","role_var":"ALIBABA_CLOUD_PLATFORM_APPLY_ROLE_ARN"},{"dir":"infra/envs/prod/access","layer":"prod-access","tfvars_var":"TFVARS_PROD_ACCESS_JSON","environment":"production-access","role_var":"ALIBABA_CLOUD_ACCESS_APPLY_ROLE_ARN"}]'
          if [ "$TARGET" = "all" ]; then
            selected=$all
          else
            selected=$(printf '%s' "$all" | python3 -c 'import json,os,sys; print(json.dumps([x for x in json.load(sys.stdin) if x["layer"] == os.environ["TARGET"]], separators=(",", ":")))')
          fi
          if [ "$selected" = "[]" ]; then
            echo "::error::未知 target: $TARGET"
            exit 1
          fi
          echo "matrix={\"include\":$selected}" >> "$GITHUB_OUTPUT"

  plan:
    name: Plan ${{ matrix.layer }}
    needs: select
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # 只输出不可用于登录的声明，不输出 JWT 本身。这样信任条件不匹配时，
      # 可以直接按实际 iss/aud/sub 排查，而不是通过放宽 RAM 策略来试错。
      - name: 核对 GitHub OIDC 身份声明
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken(process.env.ALIBABA_CLOUD_OIDC_AUDIENCE);
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString('utf8'));
            const immutableRepo = `${context.repo.owner}@${claims.repository_owner_id}`
              + `/${context.repo.repo}@${claims.repository_id}`;
            const expectedSub = context.eventName === 'pull_request'
              ? `repo:${immutableRepo}:pull_request`
              : `repo:${immutableRepo}:ref:${context.ref}`;
            const actual = { iss: claims.iss, aud: claims.aud, sub: claims.sub };
            core.info(`OIDC claims: ${JSON.stringify(actual)}`);
            if (claims.iss !== 'https://token.actions.githubusercontent.com'
                || claims.aud !== process.env.ALIBABA_CLOUD_OIDC_AUDIENCE
                || claims.sub !== expectedSub) {
              core.setFailed(`OIDC claims 不符合预期；expected sub=${expectedSub}`);
            }

      # PR 的 sub 是 pull_request；手动 main 运行的 sub 是 ref:refs/heads/main。
      # 两种入口都只能拿完全只读的 PlanRole。
      - name: 假设 TerraformPlanRole
        uses: aliyun/configure-aliyun-credentials-action@v1
        with:
          role-to-assume: ${{ vars.ALIBABA_CLOUD_PLAN_ROLE_ARN }}
          oidc-provider-arn: ${{ vars.ALIBABA_CLOUD_OIDC_PROVIDER_ARN }}
          audience: ${{ env.ALIBABA_CLOUD_OIDC_AUDIENCE }}
          role-session-name: tf-plan-${{ github.run_id }}

      - name: 写入 backend 配置
        run: |
          cat > /tmp/backend.hcl <<EOF
          bucket              = "${{ vars.TF_STATE_BUCKET }}"
          region              = "${{ vars.ALIBABA_CLOUD_REGION }}"
          tablestore_endpoint = "${{ vars.TF_STATE_LOCK_ENDPOINT }}"
          tablestore_table    = "${{ vars.TF_STATE_LOCK_TABLE }}"
          encrypt             = true
          EOF

      - name: Init
        run: terraform -chdir=${{ matrix.dir }} init -input=false -backend-config=/tmp/backend.hcl

      - name: 写入环境变量文件
        env:
          TFVARS_JSON: ${{ vars[matrix.tfvars_var] }}
        run: |
          set -euo pipefail
          if [ -z "$TFVARS_JSON" ]; then
            echo "::error::缺少 Repository Variable ${{ matrix.tfvars_var }}"
            exit 1
          fi
          printf '%s' "$TFVARS_JSON" > /tmp/${{ matrix.layer }}.tfvars.json
          python3 -m json.tool /tmp/${{ matrix.layer }}.tfvars.json >/dev/null

      - name: Plan
        id: plan
        run: |
          set -euo pipefail
          terraform -chdir=${{ matrix.dir }} plan -input=false -lock=false \
            -var-file=/tmp/${{ matrix.layer }}.tfvars.json \
            -out=tfplan -no-color | tee /tmp/plan-${{ matrix.layer }}.txt

      # apply 必须消费**这个** tfplan，而不是重新 plan：
      # 否则审批时看到的变更和实际执行的变更可能不一致，审批就只是仪式。
      - name: 规范化 plan 产物目录
        run: |
          set -euo pipefail
          mkdir -p /tmp/tfplan-artifact
          cp "${{ matrix.dir }}/tfplan" /tmp/tfplan-artifact/tfplan
          cp "/tmp/plan-${{ matrix.layer }}.txt" /tmp/tfplan-artifact/plan.txt

      - name: 上传 plan 产物
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.layer }}-${{ github.sha }}
          path: /tmp/tfplan-artifact/
          retention-days: 5

      - name: 检测危险变更
        run: |
          set -euo pipefail
          plan_txt=/tmp/plan-${{ matrix.layer }}.txt
          if grep -qE '^\s*# .* will be destroyed|must be replaced' "$plan_txt"; then
            echo "::warning::${{ matrix.layer }} 的 plan 包含删除或替换操作，审批前请逐条确认。"
          fi
          # 权限层的任何变更都要在 PR 里被显式看见。
          if [ "${{ matrix.layer }}" = "prod-access" ] && grep -qE '^Plan: [1-9]' "$plan_txt"; then
            echo "::warning::生产权限层有变更，需要安全评审（见 CODEOWNERS）。"
          fi

      - name: 评论到 PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/plan-${{ matrix.layer }}.txt', 'utf8');
            const truncated = body.length > 60000 ? body.slice(0, 60000) + '\n...(已截断，完整内容见 Actions 日志)' : body;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Terraform plan — \`${{ matrix.layer }}\`\n\n<details><summary>展开</summary>\n\n\`\`\`hcl\n${truncated}\n\`\`\`\n\n</details>`,
            });

  apply:
    name: Apply ${{ matrix.layer }}
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/main'
      && inputs.confirm_apply }}
    needs: [select, plan]
    runs-on: ubuntu-latest
    strategy:
      # 权限层和基础设施层不并行：两者都要写 state，且审批人不同。
      max-parallel: 1
      fail-fast: true
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}

    # 人工审批在这里生效：Environment 的 required reviewers 会阻塞该 Job，
    # 同时 OIDC token 的 sub 会变成 repo:<org>/<repo>:environment:<name>，
    # 这正是 apply 角色信任策略里唯一接受的 sub。审批和授权是同一件事。
    environment: ${{ matrix.environment }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: 假设 Apply 角色
        uses: aliyun/configure-aliyun-credentials-action@v1
        with:
          role-to-assume: ${{ vars[matrix.role_var] }}
          oidc-provider-arn: ${{ vars.ALIBABA_CLOUD_OIDC_PROVIDER_ARN }}
          audience: ${{ env.ALIBABA_CLOUD_OIDC_AUDIENCE }}
          role-session-name: tf-apply-${{ github.run_id }}

      - name: 下载已审批的 plan
        uses: actions/download-artifact@v8
        with:
          name: tfplan-${{ matrix.layer }}-${{ github.sha }}
          path: /tmp/artifact

      - name: 写入 backend 配置
        run: |
          cat > /tmp/backend.hcl <<EOF
          bucket              = "${{ vars.TF_STATE_BUCKET }}"
          region              = "${{ vars.ALIBABA_CLOUD_REGION }}"
          tablestore_endpoint = "${{ vars.TF_STATE_LOCK_ENDPOINT }}"
          tablestore_table    = "${{ vars.TF_STATE_LOCK_TABLE }}"
          encrypt             = true
          EOF

      - name: Init
        run: terraform -chdir=${{ matrix.dir }} init -input=false -backend-config=/tmp/backend.hcl

      - name: Apply（执行审批过的那一份 plan）
        run: |
          set -euo pipefail
          cp "/tmp/artifact/tfplan" "${{ matrix.dir }}/tfplan"
          terraform -chdir=${{ matrix.dir }} apply -input=false -lock-timeout=5m -no-color tfplan
